# Release workflow: push a tag like v0.1.5 and GitHub Actions will
#   1. run the unit tests
#   2. verify the tag matches the manifest version
#   3. build the Chrome Web Store package
#   4. attach the zip to a GitHub Release
#
# Then upload dist/firstfire-window-merger-<version>.zip manually via the
# Chrome Web Store Developer Dashboard.
#
# Free GitHub plans cover all of this: Actions is free for public repos
# (unlimited) and 2,000 min/month on private repos; release assets are free.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test test/

      - name: Verify tag matches manifest version
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$VERSION"
            exit 1
          fi

      - name: Build package
        run: ./scripts/build-package.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "FirstFire - Window Merger $GITHUB_REF_NAME" \
            --generate-notes
